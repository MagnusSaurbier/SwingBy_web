<!doctype html>
<!--
  T-06 HELM dev harness — tasks/T-06-HELM.md deliverable #4.

  Served by `npm run dev -w @swingby/web`, at /src/game/input-dev.html. Not part of the shipped
  app (T-08 BRIDGE's main.ts/index.html never reference this file) — same pattern as T-04
  AURORA's render/dev.html. Exists purely so this InputSource can be exercised standalone, and —
  the reason this file matters more than a typical dev harness — so it can be PHOTOGRAPHED OR
  RECORDED ON A REAL PHONE. Touch is a first-class requirement (PROJECT.md §2, "Playable on a
  phone... not a port afterthought"), and nobody has confirmed the boost/brake zones below are
  actually reachable with a thumb on real glass. This page is the only instrument for finding
  that out; see results/T-06-HELM.md for the exact URL and what to look for.

  What to check on a real phone:
    - Do BOOST and BRAKE register the instant a thumb lands on them (no visible lag)?
    - Holding one, then also touching the other — do BOTH read "true" at once (multi-touch)?
    - Drag a thumb off a lit zone without lifting — does it release (the label goes dim) before
      the finger fully leaves the screen edge?
    - Lift, or interrupt with a real system gesture (incoming call, notification swipe) — does
      the zone reliably end up released, never stuck lit?
    - Double-tap anywhere — the page must NOT scroll or zoom.
    - Held one-handed in portrait AND landscape, are both zones comfortably under a thumb, or
      does one require a stretch / the other hand? (This placeholder layout is not the real HUD
      — T-08 BRIDGE owns final placement — but a badly-reachable placeholder is still useful
      signal about zone SIZE, which this harness can already show.)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HELM input dev harness</title>
    <style>
      :root {
        --bg: #12141c;
        --fg: #e8f0ff;
        --dim: #8993ab;
        --border: #2a2f3d;
        --accent: #6fd0ff;
        --boost-off: rgba(111, 208, 255, 0.1);
        --boost-on: rgba(111, 208, 255, 0.6);
        --brake-off: rgba(255, 138, 111, 0.1);
        --brake-on: rgba(255, 138, 111, 0.6);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        /* Belt-and-suspenders on top of input.ts's own `target.style.touchAction = "none"` —
           kills scroll/double-tap-zoom on the whole harness page, not just the input target. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #page {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #hud {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.6;
        background: var(--bg);
        z-index: 10;
      }
      #hud .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1.1rem;
      }
      #hud b {
        color: var(--accent);
      }
      #hud .dim {
        color: var(--dim);
      }
      .state-on {
        color: #7cff9e !important;
        font-weight: 700;
      }
      #target {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: end;
        gap: 4vw;
        padding: 4vw;
      }
      .zone {
        height: 30vh;
        min-height: 110px;
        max-height: 260px;
        border: 2px solid var(--border);
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
        font-size: clamp(15px, 4.2vw, 24px);
        font-weight: 700;
        letter-spacing: 0.08em;
        transition:
          background 60ms linear,
          border-color 60ms linear,
          transform 60ms linear;
      }
      .zone .sub {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: normal;
        opacity: 0.6;
      }
      #brake-zone {
        background: var(--brake-off);
        border-color: #ff8a6f;
        justify-self: stretch;
      }
      #brake-zone.active {
        background: var(--brake-on);
        transform: scale(0.98);
      }
      #boost-zone {
        background: var(--boost-off);
        border-color: var(--accent);
        justify-self: stretch;
      }
      #boost-zone.active {
        background: var(--boost-on);
        transform: scale(0.98);
      }
      #log-panel {
        /* `top` is set from JS (syncLogPanelPosition), not a fixed guess here — #hud's height
           varies with viewport width (the keyboard-hint line wraps to 1-3 lines depending on
           width), and a hardcoded top overlapped that text on a narrow phone viewport. */
        position: fixed;
        right: 0.5rem;
        width: min(46vw, 320px);
        max-height: 44vh;
        overflow-y: auto;
        font-size: 10px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.3rem 0.5rem;
        z-index: 10;
      }
      #log-panel .title {
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 9px;
        margin-bottom: 0.15rem;
      }
      #log-lines div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="hud">
        <div class="row">
          <span>boost: <b id="state-boost">false</b></span>
          <span>brake: <b id="state-brake">false</b></span>
          <span>thrustX: <b id="state-thrustX">0</b></span>
          <span>thrustY: <b id="state-thrustY">0</b></span>
          <span class="dim">poll rate: <b id="poll-rate">0</b> Hz</span>
        </div>
        <div class="row dim">
          <span
            >keyboard (by .code, layout-independent): Space=boost ShiftLeft=brake
            R=restart Esc=menu</span
          >
        </div>
      </div>

      <div id="target">
        <div id="brake-zone" class="zone">
          <span>BRAKE</span>
          <span class="sub">ShiftLeft</span>
        </div>
        <div id="boost-zone" class="zone">
          <span>BOOST</span>
          <span class="sub">Space</span>
        </div>
      </div>

      <div id="log-panel">
        <div class="title">drained ControlAction queue</div>
        <div id="log-lines"></div>
      </div>
    </div>

    <script type="module">
      import { createInputSource } from "./input.ts";

      const pageEl = document.getElementById("page");
      const hudEl = document.getElementById("hud");
      const boostZoneEl = document.getElementById("boost-zone");
      const brakeZoneEl = document.getElementById("brake-zone");
      const logPanelEl = document.getElementById("log-panel");
      const logLinesEl = document.getElementById("log-lines");

      // `pageEl` is the InputSource's `target`: keyboard AND touch listeners both attach here
      // (see input.ts's module comment for why keyboard listens on `target`, not `window`), so
      // it must cover the whole interactive surface, not just the two zone rectangles.
      const source = createInputSource(pageEl);

      // The zone rectangles ARE real DOM elements (not just numbers) specifically so a mis-sized
      // or mis-placed zone is visible on screen immediately, per the coordinator's ask — what you
      // see drawn here is exactly what attachTouch() is hit-testing against, nothing hidden.
      function syncZones() {
        source.attachTouch({
          boost: boostZoneEl.getBoundingClientRect(),
          brake: brakeZoneEl.getBoundingClientRect(),
        });
      }

      // #hud's height varies with viewport width (its text wraps differently narrow vs. wide) —
      // computed, not a hardcoded CSS `top`, so the log panel never overlaps the live state text
      // it's meant to sit beside.
      function syncLogPanelPosition() {
        const hudBottom = hudEl.getBoundingClientRect().bottom;
        logPanelEl.style.top = `${hudBottom + 8}px`;
      }

      function syncLayout() {
        syncZones();
        syncLogPanelPosition();
      }
      syncLayout();
      window.addEventListener("resize", syncLayout);
      // `resize` fires late/inconsistently after an orientation flip on some mobile browsers —
      // re-sync again a moment later so the drawn zones/panel and the armed hit-test rects never
      // drift apart mid-session on a real phone.
      window.addEventListener("orientationchange", () => {
        syncLayout();
        setTimeout(syncLayout, 300);
      });

      const els = {
        boost: document.getElementById("state-boost"),
        brake: document.getElementById("state-brake"),
        thrustX: document.getElementById("state-thrustX"),
        thrustY: document.getElementById("state-thrustY"),
        pollRate: document.getElementById("poll-rate"),
      };

      const MAX_LOG_LINES = 60;
      function logEvent(action) {
        const stamp = new Date().toISOString().slice(11, 23);
        const line = document.createElement("div");
        line.textContent = `${stamp}  ${action}`;
        logLinesEl.prepend(line);
        while (logLinesEl.childNodes.length > MAX_LOG_LINES) {
          logLinesEl.removeChild(logLinesEl.lastChild);
        }
      }

      let pollsSinceSample = 0;
      let lastRateSample = performance.now();

      function frame() {
        // poll() returns the SAME mutable object every call (input.ts's documented
        // zero-allocation design) — read its fields immediately, don't stash the reference.
        const s = source.poll();

        els.boost.textContent = String(s.boost);
        els.boost.classList.toggle("state-on", s.boost);
        els.brake.textContent = String(s.brake);
        els.brake.classList.toggle("state-on", s.brake);
        els.thrustX.textContent = String(s.thrustX);
        els.thrustY.textContent = String(s.thrustY);
        boostZoneEl.classList.toggle("active", s.boost);
        brakeZoneEl.classList.toggle("active", s.brake);

        // Edge-triggered actions: drained once per rAF frame, never polled — matches how the
        // real game loop is meant to consume them (see input.ts's module comment).
        for (const action of source.drainEvents()) logEvent(action);

        pollsSinceSample++;
        const now = performance.now();
        const elapsed = now - lastRateSample;
        if (elapsed >= 500) {
          els.pollRate.textContent = String(Math.round((pollsSinceSample * 1000) / elapsed));
          pollsSinceSample = 0;
          lastRateSample = now;
        }

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Exposed for scripted verification (e.g. a Playwright pass) without depending on rAF
      // timing — mirrors the pattern T-04 AURORA's render/dev.ts uses for the same reason.
      window.__helmInputDev = { source, syncZones, syncLayout };
    </script>
  </body>
</html>
