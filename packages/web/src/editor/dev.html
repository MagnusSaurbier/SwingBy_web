<!doctype html>
<!--
  T-11 DRAFT dev harness. Served by `npm run dev -w @swingby/web`, at /src/editor/dev.html. Not
  part of the shipped app (T-08 BRIDGE's `main.ts`/`index.html` never reference this file) — same
  pattern T-04 AURORA used for its own `render/dev.html`. Exists so the editor can be exercised and
  screenshotted standalone, independent of whatever `ui/` wiring the orchestrator ends up doing.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRAFT dev harness</title>
    <style>
      :root {
        --bg-canvas: #05070d;
        --bg-panel: #10141f;
        --bg-panel-raised: #161b29;
        --bg-input: #0b0f18;
        --bg-hover: #1b2233;
        --bg-pressed: #222b40;
        --text-primary: #e8f0ff;
        --text-secondary: #9fb0d0;
        --text-muted: #6c7996;
        --text-on-accent: #05070d;
        --border-default: #2a2f3d;
        --border-subtle: #1c2130;
        --border-strong: #3c4459;
        --border-focus: #6fd0ff;
        --accent-cyan: #4fd3ff;
        --accent-cyan-bright: #8be9ff;
        --accent-amber: #f5c15a;
        --status-good: #57e08f;
        --status-danger: #ff6b6b;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 14px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-display: system-ui, -apple-system, sans-serif;
        --shadow-panel: 0 12px 30px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-ui);
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .editor-screen {
        height: 100%;
      }
      .editor-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border-default);
      }
      .editor-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .editor-canvas-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .editor-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #05070d;
      }
      .editor-touch-note {
        position: absolute;
        left: 8px;
        bottom: 8px;
        margin: 0;
        font-size: 11px;
        opacity: 0.7;
      }
      .editor-panel {
        width: 260px;
        max-width: 40vw;
        overflow-y: auto;
        border-left: 1px solid var(--border-default);
        padding: var(--space-3);
      }
      @media (max-width: 640px) {
        .editor-body {
          flex-direction: column;
        }
        .editor-panel {
          width: 100%;
          max-width: none;
          max-height: 45vh;
        }
      }
      .panel {
        background: var(--bg-panel);
      }
      .btn {
        background: var(--bg-panel-raised);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--border-focus);
      }
      .btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent-cyan);
        color: var(--text-on-accent);
        border-color: var(--accent-cyan);
      }
      .btn-danger {
        border-color: var(--status-danger);
        color: var(--status-danger);
      }
      .btn-block {
        display: block;
        width: 100%;
        margin-top: var(--space-2);
      }
      .field {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: var(--space-2);
      }
      .text-input {
        display: block;
        width: 100%;
        margin-top: 2px;
        background: var(--bg-input);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 4px 6px;
        font: inherit;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-bottom: var(--space-2);
      }
      .dialog-sub {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .dialog-errors {
        font-size: 12px;
        color: var(--status-danger);
        padding-left: 1.2em;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .dialog {
        width: min(360px, 90vw);
        padding: var(--space-4);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-panel);
      }
      .dialog-actions {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
