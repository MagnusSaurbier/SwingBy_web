name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck, test, parity, solvability, build, size, lint
    runs-on: ubuntu-latest
    # No step here had an explicit bound, so a hang (e.g. Chrome failing to launch
    # cleanly for the now-removed Lighthouse step) ran to GitHub's 6h platform max
    # before being killed, burning Actions minutes every time. Cap the whole job.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches what's actually installed/verified in dev (node v22.22.2) — see docs/GAME.md
          # §5. Bump this once a newer version is actually verified, not on doc say-so alone.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # --- 1. tsc --strict across every workspace -----------------------------------------
      - name: Typecheck
        run: npm run typecheck

      # --- 2. Unit tests, all packages ----------------------------------------------------
      - name: Unit tests
        run: npm test

      # --- 3. Physics regression suite (self-contained mathematical invariants) -----------
      - name: Physics regression suite
        run: npm test -w @swingby/core -- physics-regression

      # --- 4. Solvability suite (every level still completable) ---------------------------
      # Soft-skips with a warning until this suite lands.
      - name: Solvability suite
        run: |
          if find packages/core/test/level/solvability -name '*.test.ts' 2>/dev/null | grep -q .; then
            npm test -w @swingby/core -- solvability
          else
            echo "::warning::Solvability suite not landed yet (no packages/core/test/level/solvability/*.test.ts) — skipping. This becomes a hard gate automatically once it lands."
          fi

      # --- 5. Bundle size gate: fail over 250 KB gzipped for the initial route ------------
      - name: Build web app
        run: npm run build -w @swingby/web

      - name: Bundle size gate
        run: npm run size

      - name: Lint
        run: npm run lint

      # --- 6. Lighthouse gate -------------------------------------------------------------
      # Removed from the required CI job: on this runner, launching Chrome for it would
      # hang with no internal timeout, and with no job-level timeout-minutes either, GitHub
      # let it run to the 6h platform max before killing it, burning Actions minutes every
      # run. `npm run lighthouse` (infra/lighthouse-gate.mjs) still works locally in seconds
      # and against a deployed URL via --base; run it by hand until it's reinstated with a
      # verified Chrome setup and its own bounded timeout.
